<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embed demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>Any customer website</h1>
    <p>The chat button on this page comes from one script tag at the bottom of the page.</p>
    <p>
      Only <code>data-site-token</code> is required. All branding and text come from the server
      config. The optional attributes below are developer overrides.
    </p>

    <!-- here async and data-api-url is optional -->

    <script
      src="http://localhost:3000/widget.js"
      data-site-token="st_demo"
      data-api-url="http://localhost:4000"
      async
    ></script>
  </body>
</html>
